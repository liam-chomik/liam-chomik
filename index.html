<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calculator {
            background-color: #333;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .display {
            width: 100%;
            height: 60px;
            font-size: 24px;
            text-align: right;
            border: none;
            background-color: #000;
            color: #fff;
            padding: 0 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .number, .decimal {
            background-color: #666;
            color: white;
        }

        .number:hover, .decimal:hover {
            background-color: #777;
        }

        .operator {
            background-color: #ff9500;
            color: white;
        }

        .operator:hover {
            background-color: #ffad33;
        }

        .clear {
            background-color: #a6a6a6;
            color: black;
        }

        .clear:hover {
            background-color: #bfbfbf;
        }

        .equals {
            background-color: #ff9500;
            color: white;
        }

        .equals:hover {
            background-color: #ffad33;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="clear" onclick="clearEntry()">CE</button>
            <button class="operator" onclick="appendToDisplay('/')" title="Divide">÷</button>
            <button class="operator" onclick="appendToDisplay('*')" title="Multiply">×</button>
            
            <button class="number" onclick="appendToDisplay('7')">7</button>
            <button class="number" onclick="appendToDisplay('8')">8</button>
            <button class="number" onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('-')" title="Subtract">-</button>
            
            <button class="number" onclick="appendToDisplay('4')">4</button>
            <button class="number" onclick="appendToDisplay('5')">5</button>
            <button class="number" onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('+')" title="Add">+</button>
            
            <button class="number" onclick="appendToDisplay('1')">1</button>
            <button class="number" onclick="appendToDisplay('2')">2</button>
            <button class="number" onclick="appendToDisplay('3')">3</button>
            <button class="equals" onclick="calculate()" rowspan="2">=</button>
            
            <button class="number" onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
            <button class="decimal" onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <script>
        let currentInput = '';
        let operator = '';
        let previousInput = '';
        let shouldResetDisplay = false;

        function updateDisplay(value) {
            document.getElementById('display').value = value;
        }

        function appendToDisplay(value) {
            const display = document.getElementById('display');
            
            if (shouldResetDisplay) {
                display.value = '';
                shouldResetDisplay = false;
            }

            // Handle operators
            if (['+', '-', '*', '/'].includes(value)) {
                if (currentInput === '' && display.value !== '') {
                    currentInput = display.value;
                } else if (currentInput !== '' && display.value !== '' && !shouldResetDisplay) {
                    calculate();
                    currentInput = display.value;
                }
                
                operator = value;
                previousInput = currentInput;
                currentInput = '';
                shouldResetDisplay = true;
                return;
            }

            // Handle decimal point
            if (value === '.') {
                if (display.value.includes('.')) {
                    return; // Don't add multiple decimal points
                }
                if (display.value === '') {
                    display.value = '0.';
                    return;
                }
            }

            // Handle numbers
            if (display.value === '0' && value !== '.') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function calculate() {
            const display = document.getElementById('display');
            currentInput = display.value;

            if (previousInput === '' || currentInput === '' || operator === '') {
                return;
            }

            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert('Error: Division by zero');
                        clearDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            // Round to avoid floating point precision issues
            result = Math.round(result * 100000000) / 100000000;
            
            updateDisplay(result.toString());
            previousInput = '';
            currentInput = '';
            operator = '';
            shouldResetDisplay = true;
        }

        function clearDisplay() {
            updateDisplay('');
            currentInput = '';
            operator = '';
            previousInput = '';
            shouldResetDisplay = false;
        }

        function clearEntry() {
            updateDisplay('');
            currentInput = '';
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (['+', '-', '*', '/'].includes(key)) {
                appendToDisplay(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                event.preventDefault();
                const display = document.getElementById('display');
                display.value = display.value.slice(0, -1);
            }
        });
    </script>
</body>
</html>
